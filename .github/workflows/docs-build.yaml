name: docs-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint markdown
        run: npm run lint:md

      - name: Astro check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
