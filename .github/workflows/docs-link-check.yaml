name: docs-link-check

on:
  schedule:
    # Weekly Monday 03:00 UTC; check external links don't fail PR but open
    # an issue if broken links found.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check links
        id: link-check
        run: npm run check:links
        continue-on-error: true
      - name: Report broken links
        if: steps.link-check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[docs-link-check] Broken external links detected (${new Date().toISOString().slice(0,10)})`,
              body: "Weekly link check found broken external links. See workflow run for details: " + context.payload.repository.html_url + "/actions/runs/" + context.runId,
              labels: ["docs", "link-check"]
            });
